
enable
configure terminal
hostname DIS3
line console 0
logging synchronous
exec-timeout 0 0
exit
no ip domain lookup
ip routing

vtp mode server
vtp version 2
vtp domain ACADENSPY
vtp password Lab12345

vlan 100
name NATIF
vlan 101
name MGMT
vlan 121
name FMSB
vlan 122
name FS
vlan 123
name FL
vlan 124
name FSE
vlan 125
name ENS
vlan 126
name ENSPY
vlan 127
name PARC
exit

interface loopback0
description DIS3_LOOPBACK
ip address 1.1.1.23 255.255.255.255
exit

interface e0/0
description DIS3_INTERCO_CORE3
no switchport
ip address 10.10.1.13 255.255.255.252
ip ospf network point-to-point
no shutdown
exit

interface e0/1
description DIS3_INTERCO_CORE4
no switchport
ip address 10.10.1.21 255.255.255.252
ip ospf network point-to-point
no shutdown
exit

interface range e1/2-3
description DIS3_INTERCO_DIS1
channel-protocol lacp
channel-group 13 mode active
no shutdown
exit

interface Port-channel13
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk native vlan 100
switchport trunk allowed vlan 101,121,122,123,124,125,126
no shutdown
exit

interface range e0/2-3
description DIS3_TO_SW-ACC11
channel-protocol lacp
channel-group 14 mode active
no shutdown
exit

interface Port-channel14
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk native vlan 100
switchport trunk allowed vlan 101,125,126
no shutdown
exit


interface vlan 121
description FMSB
ip address 10.10.121.3 255.255.255.0
ip helper-address 10.10.2.126
standby 121 ip 10.10.121.254
no shutdown
exit
interface vlan 122
description FS
ip address 10.10.122.3 255.255.255.0
ip helper-address 10.10.2.126
standby 122 ip 10.10.122.254
no shutdown
exit
interface vlan 123
description FL
ip address 10.10.123.3 255.255.255.0
ip helper-address 10.10.2.126
standby 123 ip 10.10.123.254
no shutdown
exit

interface vlan 124
description FSE
ip address 10.10.124.3 255.255.255.0
ip helper-address 10.10.2.126
standby 124 ip 10.10.124.254
no shutdown
exit
interface vlan 125
description ENS
ip address 10.10.125.3 255.255.255.0
ip helper-address 10.10.2.126
standby 125 ip 10.10.125.254
standby 125 priority 150
standby 125 preempt
no shutdown
exit
interface vlan 126
description ENSPY
ip address 10.10.126.3 255.255.255.0
ip helper-address 10.10.2.126
standby 126 ip 10.10.126.254
standby 126 priority 150
standby 126 preempt
no shutdown
exit

router ospf 1
router-id 1.1.1.23
network 1.1.1.23 0.0.0.0 area 0
network 10.10.1.12 0.0.0.3 area 0
network 10.10.1.20 0.0.0.3 area 0
network 10.10.101.0 0.0.0.255 area 0
network 10.10.121.0 0.0.0.255 area 0
network 10.10.122.0 0.0.0.255 area 0
network 10.10.123.0 0.0.0.255 area 0
network 10.10.124.0 0.0.0.255 area 0
network 10.10.125.0 0.0.0.255 area 0
network 10.10.126.0 0.0.0.255 area 0
exit

spanning-tree mode rapid-pvst
spanning-tree vlan 125,126 priority 4096
 


do wr
