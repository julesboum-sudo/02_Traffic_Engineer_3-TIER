
enable
configure terminal
hostname R3
line console 0
logging synchronous
exec-timeout 0 0
exit
no ip domain lookup

interface loopback0
description R3_LOOPBACK
ip address 1.1.1.3 255.255.255.255
exit

interface e0/0
description R3_INTERCO_CORE3
ip address 10.10.1.30 255.255.255.252
ip ospf network point-to-point
no shutdown
exit

interface e0/1
description R3_INTERCO_CORE4
ip address 10.10.1.34 255.255.255.252
ip ospf network point-to-point
no shutdown
exit

interface e0/2
description R3_INTERCO_FAI-01
ip address 193.104.0.1 255.255.255.240
ip ospf network point-to-point
no shutdown
exit

interface e0/3
description R3_INTERCO_FAI-02
ip address 193.105.0.1 255.255.255.240
ip ospf network point-to-point
no shutdown
exit

router ospf 1
router-id 1.1.1.3
network 1.1.1.3 0.0.0.0 area 0
network 10.10.1.28 0.0.0.3 area 0
network 10.10.1.32 0.0.0.3 area 0
network 193.104.0.0 0.0.0.15 area 0
network 193.105.0.0 0.0.0.15 area 0
exit

do wr
