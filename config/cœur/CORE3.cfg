
enable
configure terminal
hostname CORE3
line console 0
logging synchronous
exec-timeout 0 0
exit
no ip domain lookup
ip routing

interface loopback0
description CORE3_LOOPBACK
ip address 1.1.1.11 255.255.255.255
exit
interface e0/0
description CORE3_INTERCO_DIS2
no switchport
ip address 10.10.1.2 255.255.255.252
ip ospf network point-to-point
no shutdown
exit
interface e0/1
description CORE3_INTERCO_R3
no switchport
ip address 10.10.1.29 255.255.255.252
ip ospf network point-to-point
no shutdown
exit
interface e0/2
description CORE3_INTERCO_DIS1
no switchport
ip address 10.10.1.10 255.255.255.252
ip ospf network point-to-point
no shutdown
exit
interface e0/3
description CORE3_LAN_SERVEUR_WSVR
no switchport
ip address 10.10.2.1 255.255.255.128
no shutdown
exit
interface e1/0
description CORE3_INTERCO_DIS3
no switchport
ip address 10.10.1.14 255.255.255.252
ip ospf network point-to-point
no shutdown
exit
interface e1/1
description CORE3_INTERCO_R4
no switchport
ip address 10.10.1.37 255.255.255.252
ip ospf network point-to-point
no shutdown
exit
interface range e1/2-3
no switchport
channel-protocol pagp
channel-group 11 mode desirable
no shutdown
exit
interface Port-channel11
description CORE3_INTERCO_CORE4_PAgP
no switchport
ip address 10.10.1.25 255.255.255.252
ip ospf network point-to-point
no shutdown
exit

router ospf 1
router-id 1.1.1.11
passive-interface Ethernet0/3
network 1.1.1.11 0.0.0.0 area 0
network 10.10.1.0 0.0.0.3 area 0
network 10.10.1.8 0.0.0.3 area 0
network 10.10.1.12 0.0.0.3 area 0
network 10.10.1.24 0.0.0.3 area 0
network 10.10.1.28 0.0.0.3 area 0
network 10.10.1.36 0.0.0.3 area 0
network 10.10.2.0 0.0.0.127 area 0
exit

do wr
