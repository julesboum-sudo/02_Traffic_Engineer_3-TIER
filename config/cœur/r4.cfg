
enable
configure terminal
hostname R4
line console 0
logging synchronous
exec-timeout 0 0
exit
no ip domain lookup

interface loopback0
description R4_LOOPBACK
ip address 1.1.1.4 255.255.255.255
exit

interface e0/0
description R4_INTERCO_CORE4
ip address 10.10.1.42 255.255.255.252
ip ospf network point-to-point
no shutdown
exit

interface e0/1
description R4_INTERCO_CORE3
ip address 10.10.1.38 255.255.255.252
ip ospf network point-to-point
no shutdown
exit

interface e0/2
description R4_INTERCO_FAI-02
ip address 193.185.0.1 255.255.255.240
ip ospf network point-to-point
no shutdown
exit

interface e0/3
description R4_INTERCO_FAI-01
ip address 193.184.0.1 255.255.255.240
ip ospf network point-to-point
no shutdown
exit

router ospf 1
router-id 1.1.1.4
network 1.1.1.4 0.0.0.0 area 0
network 10.10.1.40 0.0.0.3 area 0
network 10.10.1.36 0.0.0.3 area 0
network 193.185.0.0 0.0.0.15 area 0
network 193.184.0.0 0.0.0.15 area 0
exit

do wr
