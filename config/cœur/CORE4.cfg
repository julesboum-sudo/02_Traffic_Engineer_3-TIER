
enable
configure terminal
hostname CORE4
line console 0
logging synchronous
exec-timeout 0 0
exit
no ip domain lookup
ip routing

interface loopback0
description CORE4_LOOPBACK
ip address 1.1.1.12 255.255.255.255
exit

interface e0/0
description CORE4_INTERCO_DIS2
no switchport
ip address 10.10.1.6 255.255.255.252
ip ospf network point-to-point
no shutdown
exit
interface e0/1
description CORE4_INTERCO_R4
no switchport
ip address 10.10.1.41 255.255.255.252
ip ospf network point-to-point
no shutdown
exit
interface e0/2
description CORE4_INTERCO_DIS1
no switchport
ip address 10.10.1.18 255.255.255.252
ip ospf network point-to-point
no shutdown
exit
interface e1/0
description CORE4_INTERCO_DIS3
no switchport
ip address 10.10.1.22 255.255.255.252
ip ospf network point-to-point
no shutdown
exit
interface e1/1
description CORE4_INTERCO_R3
no switchport
ip address 10.10.1.33 255.255.255.252
ip ospf network point-to-point
no shutdown
exit
interface range e1/2-3
description CORE4_INTERCO_CORE3
no switchport
channel-protocol pagp
channel-group 11 mode desirable
no shutdown
exit
interface Port-channel11
description CORE4_INTERCO_CORE3_PAgP
no switchport
ip address 10.10.1.26 255.255.255.252
ip ospf network point-to-point
no shutdown
exit


router ospf 1
router-id 1.1.1.12
network 1.1.1.12 0.0.0.0 area 0
network 10.10.1.4 0.0.0.3 area 0
network 10.10.1.16 0.0.0.3 area 0
network 10.10.1.20 0.0.0.3 area 0
network 10.10.1.24 0.0.0.3 area 0
network 10.10.1.32 0.0.0.3 area 0
network 10.10.1.40 0.0.0.3 area 0
exit

do wr
