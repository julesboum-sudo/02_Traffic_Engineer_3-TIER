
enable
configure terminal
hostname FAI-01
line console 0
logging synchronous
exec-timeout 0 0
exit
no ip domain lookup

interface loopback0
description FAI-01_LOOPBACK
ip address 1.1.1.1 255.255.255.255
exit

interface e0/0
description FAI-01_INTERCO_R3
ip address 193.104.0.2 255.255.255.240
ip ospf network point-to-point
ip nat inside
no shutdown
exit

interface e0/1
description FAI-01_INTERCO_R4
ip address 193.184.0.2 255.255.255.240
ip ospf network point-to-point
ip nat inside
no shutdown
exit

interface e0/2
description FAI-01_INTERNET
ip address dhcp
ip nat outside
no shutdown
exit

router ospf 1
router-id 1.1.1.1
network 1.1.1.1 0.0.0.0 area 0
network 193.104.0.0 0.0.0.15 area 0
network 193.184.0.0 0.0.0.15 area 0
default-information originate
exit

access-list 1 permit 10.10.122.0 0.0.7.255
ip nat inside source list 1 interface e0/2 overload

do wr
